<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon/favicon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (() => {
        const standalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
        if (!standalone) return;
        const probe = document.createElement("div");
        probe.style.cssText =
          "position:fixed;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none";
        document.documentElement.appendChild(probe);
        const inset = Number.parseFloat(getComputedStyle(probe).paddingTop) || 0;
        probe.remove();
        if (inset > 0) return;
        document.documentElement.style.setProperty("--gigblade-safe-top", "3.25rem");
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="GigBlade" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>GigBlade</title>
    <style>
      @keyframes gigblade-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .gigblade-boot {
        display: flex;
        min-height: 100dvh;
        width: 100%;
        align-items: center;
        justify-content: center;
      }
      .gigblade-boot__ring {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
        border: 2px solid rgba(113, 113, 122, 0.2);
        border-top-color: rgba(113, 113, 122, 0.75);
        animation: gigblade-boot-spin 0.65s linear infinite;
      }
      html.dark .gigblade-boot__ring {
        border-color: rgba(250, 250, 250, 0.12);
        border-top-color: rgba(250, 250, 250, 0.7);
      }
      @media (prefers-reduced-motion: reduce) {
        .gigblade-boot__ring {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme") || '"system"';
          const parsedTheme = JSON.parse(theme);

          let resolvedTheme = parsedTheme;
          if (parsedTheme === "system") {
            resolvedTheme = window.matchMedia("(prefers-color-scheme: dark)")
              .matches
              ? "dark"
              : "light";
          }

          document.documentElement.classList.add(resolvedTheme);
          document.documentElement.style.backgroundColor =
            resolvedTheme === "dark" ? "#000000" : "#fafaf9";
        } catch (e) {
          document.documentElement.classList.add("light");
          document.documentElement.style.backgroundColor = "#fafaf9";
        }
      })();
    </script>

    <script type="module">
      if (import.meta.env.DEV && import.meta.env.VITE_REACT_GRAB === "1") {
        import("react-grab");
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="gigblade-boot" role="status" aria-live="polite" aria-label="Cargando">
        <div class="gigblade-boot__ring" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
